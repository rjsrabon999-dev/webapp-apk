  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getDatabase(app);

  // Expose firebase database functions globally for the app
  window.dbRef = ref;
  window.dbSet = set;

  const bgStyle = b.img ? `background-image:url('${b.img}')` : `background:${b.bg}`;
  const hasImgClass = b.img ? 'has-img' : '';
  return `<div class="sl ${index===0?'on':''} ${hasImgClass}" style="${bgStyle}"><b>${E(b.title||'')}</b><span>${E(b.sub||'')}</span><i>${E(b.icon||'')}</i></div>`;
}).join('');
const l=list();
return `<div class="ban" id="bn">${bannersHtml}</div>
<div class="sec"><div class="cg">${CATS.map(c=>`<div class="ci ${S.cat==c[0]?'on':''}" data-a="cat" data-id="${c[0]}"><div>${c[2]}</div>${c[1]}</div>`).join('')}</div></div>
<div class="sec"><h3>${S.cat?CATS.find(c=>c[0]==S.cat)[1]:'উপলব্ধ ড্রাইভার ও রাইডসমূহ'} ${S.q?'— "'+E(S.q)+'"':''}</h3></div>
${l.length?`<div class="pg">${l.map(pc).join('')}</div>`:'<div class="emp"><b>🔍</b>উক্ত স্থান বা রুটে কোনো ড্রাইভার পাওয়া যায়নি</div>'}
<div class="sec" style="margin-top:14px"><div class="trust"><div><b>📞</b>ডিরেক্ট কল</div><div><b>💬</b>WhatsApp</div><div><b>🛡️</b>নিরাপদ ট্রিপ</div></div></div>
<div class="sec">${supCard()}</div>
<footer>© রাইড শেয়ার • ডিরেক্ট কল ও হোয়াটসঅ্যাপ সার্ভিস</footer>`},

cats(){return `<div class="sec"><h3>সকল যানবাহন টাইপ</h3><div class="cg">${CATS.map(c=>`<div class="ci" data-a="cat" data-id="${c[0]}"><div>${c[2]}</div>${c[1]}</div>`).join('')}</div></div>`},

sup(){return `<div class="sec" style="margin-top:0"><button class="btn s o" data-a="back">← পিছনে</button></div>
<div class="sec"><h3>🎧 কাস্টমার সাপোর্ট</h3><div class="mt" style="margin-bottom:8px">যেকোনো সমস্যা থাকলে WhatsApp-এ সরাসরি যোগাযোগ করুন।</div>
<div><a class="btn w f" target="_blank" rel="noopener" href="https://wa.me/88${SUP}?text=হেল্প%20দরকার">💬 WhatsApp মেসেজ</a></div></div>
<div class="sec"><h3>❓ সাধারণ প্রশ্নোত্তর (FAQ)</h3>${FAQ.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div>`},

pd(){const p=P.find(x=>x.id==S.a);if(!p)return VW.home();const s=usr(p.sel);
const mapUrl = p.map ? p.map : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.pl)}`;
return `<div class="sec" style="margin-top:0"><button class="btn s o" data-a="back">← পিছনে</button></div>
<div class="im" style="background:#fff;aspect-ratio:auto;height:220px">${p.img?`<img src="${p.img}" alt="">`:`<span style="font-size:100px">${p.em}</span>`}</div>
<div class="sec">
  <div style="font-size:18px;font-weight:700">${E(p.name)}</div>
  <div class="mt">📍 ড্রাইভারের বর্তমান স্থান: <b>${E(p.pl)}</b></div>
  <div style="margin-top:6px"><a class="map-btn" target="_blank" rel="noopener" href="${E(mapUrl)}">🗺️ ম্যাপে ড্রাইভারের গাড়ি দেখুন</a></div>
  <div class="mt" style="margin-top:8px">ভাড়া: <b>${mo(p.pr)} / ${p.un}</b></div>
</div>
<div class="sec">
  <div class="mt">ড্রাইভার বিবরণ</div>
  <b>🚘 ${E(s.shop)} (${E(s.n)})</b>
  <div class="btn-action-group" style="margin-top:12px">
    <a class="btn g" href="tel:${E(s.wa)}">📞 কল দিন</a>
    <a class="btn w" target="_blank" rel="noopener" href="https://wa.me/88${E(String(s.wa).replace(/^\+?88/,''))}?text=${encodeURIComponent('আসসালামু আলাইকুম, "'+p.name+'" রাইড বুক করতে চাই')}">💬 WhatsApp</a>
  </div>
</div>
<div class="gr" style="padding:0 8px"><button class="btn b" data-a="add" data-id="${p.id}">🎟️ লিস্টে রাখুন</button><button class="btn" data-a="buy" data-id="${p.id}">বুকিং ফর্ম খুলুন</button></div>
<div class="sec">${supCard()}</div>`},

cart(){const it=C.map(c=>({c,p:P.find(p=>p.id==c.id)})).filter(x=>x.p);
if(!it.length)return `<div class="emp"><b>🎟️</b>কোনো রাইড যুক্ত নেই<br><br><button class="btn" data-a="nv" data-id="home">রাইড খুঁজুন</button></div>`;
const sub=it.reduce((s,x)=>s+x.p.pr*x.c.q,0);
return `<div class="sec"><h3>🎟️ বুকিং পছন্দ তালিকা (${bn(it.length)})</h3>${it.map(({c,p})=>`<div class="ln"><div class="im">${p.img?`<img src="${p.img}" alt="">`:p.em}</div><div style="flex:1"><div class="pn" style="height:auto">${E(p.name)}</div><div class="mt">ড্রাইভার: ${E(usr(p.sel).shop)}</div><div class="row sp" style="margin-top:6px"><b style="color:var(--o)">${mo(p.pr*c.q)}</b></div></div><button class="btn r s" data-a="rm" data-id="${p.id}" style="align-self:flex-start">✕</button></div>`).join('')}
<div class="sm t"><span>মোট ভাড়া</span><span>${mo(sub)}</span></div><button class="btn f" data-a="chk">কনফার্মেশন পেজে যান</button></div>`},

chk(){const u=me();if(!u){toast('আগে লগইন করুন');S.tab='login';return VW.acc()}
const it=C.map(c=>({c,p:P.find(p=>p.id==c.id)})).filter(x=>x.p),sub=it.reduce((s,x)=>s+x.p.pr*x.c.q,0);
return `<div class="sec"><h3>রাইড বুকিং ফর্ম</h3>
<label>যাত্রীর নাম</label><input id="cn" value="${E(u.n)}">
<label>WhatsApp / ফোন নম্বর</label><input id="cw" value="${E(u.wa)}" inputmode="tel">
<label>পিকআপ ও গন্তব্য এলাকা/রুট লিখুন *</label><textarea id="ca" rows="2" placeholder="যেমন: পিকআপ: কাশিগঞ্জ, গন্তব্য: ইসলামপুর">${E(u.addr||'')}</textarea>
<div class="sec"><div class="sm t"><span>আনুমানিক ভাড়া</span><span style="color:var(--o)">${mo(sub)}</span></div><button class="btn f" data-a="place">বুকিং নিশ্চিত করুন</button></div>`},

acc(){const u=me();if(!u)return `<div class="tabs"><button data-a="tab" data-id="login" class="${S.tab=='login'?'on':''}">লগইন</button><button data-a="tab" data-id="reg" class="${S.tab=='reg'?'on':''}">নতুন অ্যাকাউন্ট</button></div><div class="sec">${S.tab=='login'?`<label>Gmail</label><input id="le" type="email" placeholder="example@gmail.com"><label>পাসওয়ার্ড</label><input id="lp" type="password"><button class="btn f" data-a="login">লগইন</button>`:
`<div class="gr"><button class="btn ${S.role=='p'?'':'o'}" data-a="role" data-id="p">🚶 প্যাসেঞ্জার</button><button class="btn ${S.role=='d'?'':'o'}" data-a="role" data-id="d">🚘 ড্রাইভার</button></div>
<label>পুরো নাম *</label><input id="rn"><label>Gmail *</label><input id="re" type="email"><label>WhatsApp/ফোন নম্বর *</label><input id="rw" type="tel"><label>পাসওয়ার্ড *</label><input id="rp" type="password">
<div id="sf" style="display:${S.role=='d'?'block':'none'}"><label>সার্ভিস/গাড়ির নাম *</label><input id="rs"><label>রুট/এলাকা *</label><input id="ra" placeholder="যেমন: কাশিগঞ্জ টু ইসলামপুর"><label>বিকাশ/নগদ নম্বর *</label><input id="rb" type="tel"></div>
<button class="btn f" data-a="reg">অ্যাকাউন্ট খুলুন</button>`}</div>
<div class="sec" style="text-align:center"><button class="btn o s" data-a="adm_login_page">⚙️ এডমিন প্যানেল</button></div>`;

return `<div class="sec" style="background:var(--g);color:#fff;margin-top:0"><div style="font-size:18px;font-weight:700">👤 ${E(u.n)}</div><div style="opacity:.9">${E(u.em)} • ${E(u.wa)}</div><span class="tag p">${u.role=='d'?'ড্রাইভার — '+E(u.shop):'প্যাসেঞ্জার'}</span></div>
<div class="sec">${u.role=='d'?`<button class="btn g f" data-a="nv" data-id="sel" style="margin-top:0">🚘 ড্রাইভার সেন্টার</button>`:''}<button class="btn f" data-a="nv" data-id="ord" style="${u.role=='d'?'':'margin-top:0'}">📑 আমার রাইড বুকিং</button><button class="btn r f" data-a="out">লগআউট</button></div>
<div class="sec" style="text-align:center"><button class="btn o s" data-a="adm_login_page">⚙️ এডমিন প্যানেল</button></div>`},

ord(){const l=O.filter(o=>o.by==ME);if(!l.length)return `<div class="emp"><b>📑</b>আপনার কোনো রাইড হিস্ট্রি নেই</div>`;
return `<div class="sec"><h3>📑 আমার রাইডসমূহ</h3>${l.map(o=>`<div style="border:1px solid var(--l);border-radius:10px;padding:10px;margin-bottom:10px"><div class="mt">#${bn(String(o.id).slice(-6))} • ${o.dt}</div>${o.it.map((i,k)=>{
  const driverObj = usr(i.sel);
  const driverWa = E(String(driverObj.wa).replace(/^\+?88/,''));
  return `<div style="margin-top:8px"><div class="row sp"><span>${i.em} <b>${E(i.name)}</b><br><span class="mt">${E(driverObj.shop)}</span></span><span style="text-align:right"><b>${mo(i.pr*i.q)}</b><br><span class="tag ${i.st=='বাতিল'?'x':i.st=='কমপ্লিট'?'':'p'}">${i.st}</span></span></div>
  <div class="btn-action-group">
    <a class="btn g s" href="tel:${E(driverObj.wa)}">📞 কল দিন</a>
    <a class="btn w s" target="_blank" rel="noopener" href="https://wa.me/88${driverWa}">💬 WhatsApp</a>
  </div></div>`;
}).join('')}</div>`).join('')}</div>`},

sel(){const u=me();if(!u||u.role!='d')return VW.acc();
const mp=P.filter(p=>p.sel==ME),mi=[];O.forEach(o=>o.it.forEach((i,k)=>{if(i.sel==ME)mi.push({o,i,k})}));
const tabs=`<div class="tabs">${[['dash','📊 ড্যাশবোর্ড'],['add','➕ নতুন রাইড যোগ'],['prods','🚘 আমার রাইড'],['ords','📑 বুকিং']].map(t=>`<button data-a="st" data-id="${t[0]}" class="${S.st==t[0]?'on':''}">${t[1]}</button>`).join('')}</div>`;
if(S.st=='dash')return tabs+`<div class="sec"><div class="gr"><div class="stat"><b>${bn(mp.length)}</b>পোস্টকৃত রাইড</div><div class="stat"><b>${bn(mi.length)}</b>বুকিং</div></div></div>`;
if(S.st=='add')return tabs+`<div class="sec">
<label>যানবাহনের ছবি</label><div class="row"><div class="im" id="pv" style="width:70px;height:70px;font-size:30px;flex:none">${S.img?`<img src="${S.img}" alt="">`:'📷'}</div><input type="file" id="pimg" accept="image/*"></div>
<label>আইকন</label><select id="pe">${EM.map(e=>`<option>${e}</option>`).join('')}</select>
<label>রাইড বা রুটের শিরোনাম *</label><input id="pn" placeholder="যেমন: কাশিগঞ্জ টু ইসলামপুর এক্সপ্রেস">
<label>যানবাহন টাইপ *</label><select id="pc">${CATS.map(c=>`<option value="${c[0]}">${c[2]} ${c[1]}</option>`).join('')}</select>
<div class="gr"><div><label>ভাড়া (৳) *</label><input id="pp" type="number"></div><div><label>একক</label><select id="pu">${UN.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>খালি সিট *</label><input id="ps" type="number" value="1"></div></div>
<label>পিকআপ স্থান / এলাকা *</label><input id="pl" placeholder="যেমন: কাশিগঞ্জ মোড় / স্ট্যান্ড">
<label>Google Maps লোকেশন লিংক (সরাসরি লাইভ লোকেশন দেখার জন্য)</label><input id="pm" placeholder="যেমন: https://maps.google.com/?q=23.8103,90.4125">
<button class="btn f g" data-a="addp">রাইড প্রকাশ করুন</button></div>`;

if(S.st=='prods')return tabs+`<div class="sec">${mp.length?mp.map(p=>`<div class="ln"><div class="im">${p.img?`<img src="${p.img}" alt="">`:p.em}</div><div style="flex:1"><b>${E(p.name)}</b><div class="mt">ভাড়া: ${mo(p.pr)} • সিট: ${bn(p.stk)}</div><div class="mt">📍 স্থান: ${E(p.pl)}</div></div><button class="btn r s" data-a="delp" data-id="${p.id}">🗑 মোছ</button></div>`).join(''):'<div class="emp">কোনো রাইড পোস্ট করা নেই</div>'}</div>`;

return tabs+`<div class="sec">${mi.length?mi.map(({o,i,k})=>`<div style="border:1px solid var(--l);border-radius:10px;padding:10px;margin-bottom:10px">
  <div class="mt">#${bn(String(o.id).slice(-6))} • ${o.dt}</div><b>${i.em} ${E(i.name)}</b>
  <div class="mt">👤 প্যাসেঞ্জার: ${E(o.nm)} • 📍 ঠিকানা: ${E(o.ad)}</div>
  <div class="btn-action-group">
    <a class="btn g s" href="tel:${E(o.wa)}">📞 প্যাসেঞ্জারকে কল</a>
    <a class="btn w s" target="_blank" rel="noopener" href="https://wa.me/88${E(String(o.wa).replace(/^\+?88/,''))}">💬 WhatsApp</a>
  </div>
</div>`).join(''):'<div class="emp">কোনো বুকিং আসেনি</div>'}</div>`;
},

  if(S.admTab=='users'){
    return tabs+`<div class="sec">
      <h3>👥 নিবন্ধিত ব্যবহারকারী (মোট: ${bn(U.length)})</h3>

          <button class="btn ${u.blocked?'g':'r'} s" data-a="adm_toggle_user" data-id="${E(u.em)}">${u.blocked?'আনব্লক':'ব্লক'}</button>

  if(S.admTab=='prods'){

        <div class="im">${p.img?`<img src="${p.img}" alt="">`:p.em}</div>

          <button class="btn r s" data-a="adm_del_prod" data-id="${p.id}">🗑 মোছ</button>

      </div>`).join(''):'<div class="emp">কোনো রাইড নেই</div>'}

  if(S.admTab=='banners'){
    return tabs+`<div class="sec">
      <h3>🖼️ হোমপেজ ব্যানার ম্যানেজমেন্ট</h3>
      <label>মেমোরি/গ্যালারি থেকে সরাসরি ব্যানার পিকচার আপলোড করুন *</label>

      <input id="ban_sub" placeholder="যেমন: আজই আপনার রাইড বুক করুন">

  if(S.admTab=='ords'){
    return tabs+`<div class="sec">
      <h3>📑 সকল বুকিং হিস্ট্রি (মোট: ${bn(O.length)})</h3>
      ${O.length?O.map(o=>`<div style="border:1px solid var(--l);border-radius:10px;padding:10px;margin-bottom:10px">
        <div class="mt">#${bn(String(o.id).slice(-6))} • ${o.dt}</div>
        <div class="mt">প্যাসেঞ্জার: <b>${E(o.nm)} (${E(o.wa)})</b></div>
        <div class="mt">ঠিকানা: ${E(o.ad)}</div>
      </div>`).join(''):'<div class="emp">কোনো বুকিং পাওয়া যায়নি</div>'}
    </div>`;
  }

  if(S.admTab=='set'){
    return tabs+`<div class="sec">
      <h3>⚙️ এডমিন সেটিংস</h3>
      <label>নতুন এডমিন পিন দিন</label>
      <input type="password" id="adm_new_pin" placeholder="নতুন পিন">
      <button class="btn f g" data-a="adm_change_pin">পিন পরিবর্তন করুন</button>
      <hr style="margin:20px 0;border:0;border-top:1px solid var(--l)">
      <button class="btn r f" data-a="adm_logout">এডমিন লগআউট</button>
    </div>`;
  }
}
};

function render(){
  const topElem = $('#top');
  if(topElem) topElem.style.display=['home','cats'].includes(S.v)?'block':'none';
  const vElem = $('#v');
  if(vElem) vElem.innerHTML=(VW[S.v]||VW.home)();
  
  if(S.v=='home'){
    let slides = document.querySelectorAll('.ban .sl');
    if(slides.length > 1){
      let currentSlide = 0;
      clearInterval(window.bannerInterval);
      window.bannerInterval = setInterval(()=>{
        slides[currentSlide].classList.remove('on');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('on');
      }, 3500);
    }
  }

  const cb=$('#cb');
  if(cb){cb.style.display=C.length?'block':'none';cb.textContent=bn(C.length);}
  const m={home:'home',cats:'cats',pd:'home',cart:'cart',chk:'cart',acc:'acc',ord:'acc',sel:'acc',sup:'acc',admin:'acc'}[S.v];
  document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.n==m));
}

document.addEventListener('input',e=>{
  if(e.target.id=='q'){
    S.q=e.target.value.trim();
    if(S.v!='home')S.v='home';
    render();
    const qIn=$('#q');
    if(qIn){ qIn.focus(); qIn.selectionStart = qIn.selectionEnd = qIn.value.length; }
  }
});

document.addEventListener('change',e=>{
  if(e.target.id=='pimg'&&e.target.files[0]){
    const r=new FileReader();
    r.onload=()=>{
      S.img=r.result;
      const pv=$('#pv');
      if(pv) pv.innerHTML=`<img src="${S.img}" alt="">`;
    };
    r.readAsDataURL(e.target.files[0]);
  }
  if(e.target.id=='ban_img_file'&&e.target.files[0]){
    const r=new FileReader();
    r.onload=()=>{
      S.banImg=r.result;
      const bpv=$('#ban_pv');
      if(bpv) bpv.innerHTML=`<img src="${S.banImg}" alt="">`;
    };
    r.readAsDataURL(e.target.files[0]);
  }
});

const g=i=>($('#'+i)?.value||'').trim();
const sh=on=>{ const el=$('#sh'); if(el) el.classList.toggle('on',on); }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a], [data-n]');if(!t)return;
  
  if(t.dataset.n){
    S.q='';
    const qIn=$('#q');if(qIn)qIn.value='';
    S.cat='';
    nav(t.dataset.n);
    return;
  }

  const a=t.dataset.a,id=t.dataset.id;
  if(a=='shx'){if(e.target===t)sh(false);return}
  if(a=='sup')sh(true);
  else if(a=='supp'){sh(false);nav('sup')}
  else if(a=='open'){nav('pd',id)}
  else if(a=='back')nav('home',null);
  else if(a=='cat'){S.cat=S.cat==id?'':id;S.q='';const qIn=$('#q');if(qIn)qIn.value='';nav('home',null)}
  else if(a=='nv')nav(id);
  else if(a=='add'||a=='buy'){
    const u=me();
    if(!u){toast('আগে লগইন করুন');S.tab='login';return nav('acc')}
    const p=P.find(x=>x.id==id);
    if(p.sel==ME)return toast('নিজের পোস্টকৃত রাইড নিজে পছন্দের তালিকায় যোগ করা যাবে না');
    let c=C.find(x=>x.id==id);
    c ? c.q=1 : C.push({id:p.id,q:1});
    sv();if(a=='buy')nav('chk');else{render();toast('✅ লিস্টে রাখা হয়েছে')}
  }
  else if(a=='rm'){C=C.filter(x=>x.id!=id);sv();render()}
  else if(a=='chk'){if(!me()){toast('আগে অ্যাকাউন্ট প্রয়োজন');S.tab='login';return nav('acc')}nav('chk')}
  else if(a=='place'){
    const nm=g('cn'),wa=g('cw'),ad=g('ca');if(!nm||!ad)return toast('নাম ও ঠিকানা দিন');
    const it=C.map(c=>({c,p:P.find(p=>p.id==c.id)})).filter(x=>x.p);
    const sub=it.reduce((s,x)=>s+x.p.pr*x.c.q,0);
    O.unshift({id:Date.now(),by:ME,dt:new Date().toLocaleDateString('bn-BD'),nm,wa,ad,pay:'ক্যাশ',tot:sub,it:it.map(x=>({pid:x.p.id,name:x.p.name,em:x.p.em,un:x.p.un,pr:x.p.pr,q:x.c.q,sel:x.p.sel,st:'পেন্ডিং'}))});
    C=[];sv();toast('🎉 বুকিং সম্পন্ন!');nav('ord')
  }
  else if(a=='tab'){S.tab=id;render()}
  else if(a=='role'){S.role=id;render()}
  else if(a=='login'){
    const leVal=g('le').toLowerCase(), lpVal=g('lp');
    const u=U.find(x=>x.em==leVal&&x.pw==H(lpVal));
    if(!u)return toast('Gmail বা পাসওয়ার্ড ভুল');
    ME=u.em;sv();toast('স্বাগতম, '+u.n);nav('acc')
  }
  else if(a=='reg'){
    const em=g('re').toLowerCase(),s=S.role=='d';
    if(g('rn').length<3||!GM.test(em)||!WA.test(g('rw'))||g('rp').length<6)return toast('সঠিক তথ্য দিন');
    U.push({em,n:g('rn'),wa:g('rw'),pw:H(g('rp')),h:1,role:s?'d':'p',shop:g('rs'),area:g('ra'),pay:g('rb'),blocked:false});
    ME=em;sv();toast('🎉 অ্যাকাউন্ট তৈরি হয়েছে');nav(s?'sel':'acc')
  }
  else if(a=='out'){ME=null;sv();toast('লগআউট হয়েছে');nav('home',null)}
  else if(a=='st'){S.st=id;render()}
  else if(a=='addp'){
    const n=g('pn'),pr=+g('pp'),sk=+g('ps'),map=g('pm');if(!n||!g('pl'))return toast('নাম ও স্থান দিন');
    P.unshift({id:Date.now(),name:n,sel:ME,cat:g('pc'),em:g('pe'),pr,old:0,un:g('pu'),stk:sk,pl:g('pl'),img:S.img,pinned:false,map:map});
    S.img='';S.st='prods';sv();toast('✅ রাইড প্রকাশিত');render()
  }
  else if(a=='delp'){if(confirm('রাইডটি মুছবেন?')){P=P.filter(x=>x.id!=id);sv();render()}}
  
  else if(a=='adm_login_page'){nav('admin')}
  else if(a=='adm_login'){
    const pin=g('adm_pin_in');
    if(pin===ADMIN_PIN){
      IS_ADMIN_LOGGED=true;
      sv();
      toast('✅ এডমিন লগইন সফল');
      render();
    } else {
      toast('❌ ভুল এডমিন পিন');
    }
  }
  else if(a=='adm_tab'){S.admTab=id;render()}
  else if(a=='adm_toggle_user'){
    const u=U.find(x=>x.em==id);
    if(u){
      u.blocked = !u.blocked;
      sv();
      toast(u.blocked ? '🚫 অ্যাকাউন্ট ব্লক করা হয়েছে' : '✅ অ্যাকাউন্ট সক্রিয় করা হয়েছে');
      render();
    }
  }
  else if(a=='adm_del_prod'){
    if(confirm('এডমিন হিসেবে রাইডটি মুছবেন?')){
      P=P.filter(x=>x.id!=id);
      sv();
      toast('🗑️ মুছে ফেলা হয়েছে');
      render();
    }
  }
  else if(a=='adm_add_banner'){
    const title = g('ban_title'), sub = g('ban_sub');
    if(!S.banImg && !title) return toast('ছবি নির্বাচন করুন অথবা শিরোনাম দিন');
    Banners.push({
      title: title, 
      sub: sub, 
      icon: S.banImg ? '' : '🚗', 
      bg: 'linear-gradient(120deg,#1e88e5,#1565c0)',
      img: S.banImg || ''
    });
    S.banImg = '';
    sv();
    toast('✅ ব্যানার যুক্ত হয়েছে');
    render();
  }
  else if(a=='adm_del_banner'){
    if(confirm('এই ব্যানারটি মুছে ফেলবেন?')){
      Banners.splice(id, 1);
      sv();
      toast('🗑️ ব্যানার মুছে ফেলা হয়েছে');
      render();
    }
  }
  else if(a=='adm_change_pin'){
    const np=g('adm_new_pin');
    if(np.length < 4) return toast('পিন কমপক্ষে ৪ সংখ্যার দিন');
    ADMIN_PIN=np;
    sv();
    toast('✅ এডমিন পিন সফলভাবে পরিবর্তন হয়েছে');
    render();
  }
  else if(a=='adm_logout'){
    IS_ADMIN_LOGGED=false;
    sv();
    toast('এডমিন প্যানেল থেকে লগআউট হয়েছে');
    nav('home');
  }
});

function nav(v,a){S.v=v;S.a=a;if(v=='home'&&a===undefined){S.cat=''}render();scrollTo(0,0)}
render();
</script>
</body>
