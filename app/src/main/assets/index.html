<script>
/* =====================================================================
   শেয়ার্ড ডেটা লেয়ার — ইউজার অ্যাপ ও অ্যাডমিন অ্যাপে হুবহু একই কোড
   -------------------------------------------------------------------
   ফায়ারবেজ কনফিগ নিচে বসানো আছে (দুই অ্যাপেই একই)। কনফিগ null করলে লোকাল মোডে চলবে।
         তখন ছবি/ভিডিও/ভয়েস যাবে Firebase Storage এ, লেখা ও হাসির
         গণনা যাবে Firestore এ, আর দুই অ্যাপ নিজে নিজেই সংযুক্ত হবে।

   Firestore কালেকশন:  levels/{১-১০০}, stats/{১-১০০}, stats/_app, settings/texts, settings/intro
   Storage পাথ:        levels/{n}/media_*  ও  levels/{n}/audio_*

   ফায়ারবেজ রুলসের উদাহরণ (টেস্টের জন্য; পরে Auth দিয়ে অ্যাডমিন সুরক্ষিত করুন):
     levels  : সবাই read, write শুধু অ্যাডমিন
     stats   : সবাই read ও write (শুধু count/users বাড়ানো)
   ===================================================================== */
const TOTAL = 100;
const FIREBASE_CONFIG = {

  authDomain: "__KEY_2__",
  projectId: "hasi-app-ce484",
  storageBucket: "hasi-app-ce484.firebasestorage.app",

};

*/

/* ---------- সম্পাদনযোগ্য লেখা (অ্যাডমিন থেকে বদলানো যায়) ---------- */
const DEFAULT_TEXTS = {
  splashTitle: '⚠️ সতর্কবার্তা ⚠️\nহাসলে অ্যাপস ডিলিট করে দিন!',

  noToast: '😢 ঠিক আছে, গম্ভীর থাকুন... আবার আসবেন!',
  levelWord: 'লেভেল',
  tapHint: '👆 স্ক্রিনে ট্যাপ করুন',
  gatePrev: '⬅ আগের লেভেল',
  prevBtn: '⬅ আগে',
  nextBtn: 'পরবর্তী লেভেল ➡️',
  finishBtn: '🏁 শেষ করুন',
  reactBtn: '😂 হাসি পেয়েছে!',

/* [কী, অ্যাডমিনে দেখানো নাম, বহুলাইন?] */
const TEXT_FIELDS = [
  ['👋 শুরুর স্ক্রিন', null],
  ['splashTitle', 'বড় সতর্কবার্তা (নতুন লাইনে ভাগ করা যায়)', 1],
  ['splashSub', 'ছোট লেখা'],

  ['tapHint', 'ট্যাপ করার নির্দেশ'],
  ['gatePrev', 'আগের লেভেল বাটন'],
  ['firstToast', 'প্রথম লেভেলে পেছনে গেলে বার্তা'],
  ['noBackToast', 'পেছনে যাওয়া বন্ধের বার্তা'],
  ['🖼️ ছবি/ভিডিওর স্ক্রিন', null],
  ['prevBtn', 'আগে বাটন'],
  ['nextBtn', 'পরবর্তী লেভেল বাটন'],
  ['finishBtn', '১০০ নম্বরে শেষ করার বাটন'],
  ['reactBtn', 'হাসির বাটন'],
  ['reactDone', 'হাসার পর বাটনের লেখা'],
  ['reactToast', 'হাসি জানানোর বার্তা'],
  ['reactAgain', 'আবার চাপলে বার্তা'],
  ['defaultCaps', 'ডিফল্ট হাসির লেখা (প্রতি লাইনে একটা; লেভেলে আলাদা লেখা না থাকলে এগুলো ঘুরেফিরে আসবে)', 1],
  ['🏆 শেষ স্ক্রিন', null],
  ['endTitle', 'অভিনন্দন লেখা', 1],
  ['endSub', 'ছোট লেখা'],
  ['endPrev', 'ফিরে যাওয়ার বাটন']
];


function safeJSON(k, def){ try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; }catch(e){ return def; } }
function setJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function isVideo(f){ return (f.type && f.type.indexOf('video') === 0) || /\.(mp4|webm|mov|3gp|mkv|m4v)$/i.test(f.name || ''); }
function resizeBlob(file, max, q){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = ()=>{
      let w = im.naturalWidth, h = im.naturalHeight;
      const s = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', q);
    };
    im.onerror = ()=>{ URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}

/* ---------- লোকাল ডেটা লেয়ার (IndexedDB + localStorage) ---------- */
async function localStore(){
  let db = null; const mem = {}; const urls = {};
  await new Promise(res=>{
    try{
      const r = indexedDB.open('hasi100d', 1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore('levels', {keyPath:'id'}); };
      r.onsuccess = ()=>{ db = r.result; res(); };
      r.onerror = ()=>res();
    }catch(e){ res(); }
  });
  function getRec(id){
    return new Promise(res=>{
      if(!db) return res(mem[id] || null);
      try{
        const q = db.transaction('levels').objectStore('levels').get(id);
        q.onsuccess = ()=>res(q.result || null);
        q.onerror = ()=>res(mem[id] || null);
      }catch(e){ res(mem[id] || null); }
    });
  }
  function putRec(rec){
    return new Promise(res=>{
      const keep = !!(rec.blob || rec.audio || rec.caption);
      if(keep) mem[rec.id] = rec; else delete mem[rec.id];
      if(!db) return res();
      try{
        const tx = db.transaction('levels', 'readwrite');
        const s = tx.objectStore('levels');
        if(keep) s.put(rec); else s.delete(rec.id);
        tx.oncomplete = ()=>res(); tx.onerror = ()=>res(); tx.onabort = ()=>res();
      }catch(e){ res(); }
    });
  }
  function dropUrls(id){
    ['blob', 'audio'].forEach(k=>{
      const key = id + ':' + k;
      if(urls[key]){ try{ URL.revokeObjectURL(urls[key]); }catch(e){} delete urls[key]; }
    });
  }
  function u(r, k){ const key = r.id + ':' + k; if(!urls[key]) urls[key] = URL.createObjectURL(r[k]); return urls[key]; }
  function view(r){
    if(!r) return null;
    return {
      id: r.id, type: r.blob ? (r.type || 'image') : '', caption: r.caption || '',
      mediaSrc: r.blob ? u(r, 'blob') : '', audioSrc: r.audio ? u(r, 'audio') : '',
      audioName: r.audioName || '', loop: !!r.loop
    };
  }
  const blank = id => ({id:id, type:'', blob:null, caption:'', audio:null, audioName:'', loop:false});
  return {
    mode: 'local',
    async getLevel(n){ return view(await getRec(n)); },
    async getAllLevels(){
      const out = {};
      for(let i = 1; i <= TOTAL; i++){ const r = await getRec(i); if(r) out[i] = view(r); }
      return out;
    },
    async setMedia(n, file){
      const type = isVideo(file) ? 'video' : 'image';
      const blob = type === 'video' ? file : await resizeBlob(file, 1200, .85);
      const r = (await getRec(n)) || blank(n);
      dropUrls(n); r.blob = blob; r.type = type;
      await putRec(r);
    },
    async setAudio(n, file){
      const r = (await getRec(n)) || blank(n);
      dropUrls(n); r.audio = file; r.audioName = file.name || 'ভয়েস';
      await putRec(r);
    },
    async setCaption(n, t){ const r = (await getRec(n)) || blank(n); r.caption = t; await putRec(r); },
    async setLoop(n, v){ const r = await getRec(n); if(!r) return; r.loop = !!v; await putRec(r); },
    async delMedia(n){ const r = await getRec(n); if(!r) return; dropUrls(n); r.blob = null; r.type = ''; await putRec(r); },
    async delAudio(n){ const r = await getRec(n); if(!r) return; dropUrls(n); r.audio = null; r.audioName = ''; r.loop = false; await putRec(r); },
    async clearAll(){
      Object.keys(urls).forEach(k=>{ try{ URL.revokeObjectURL(urls[k]); }catch(e){} delete urls[k]; });
      Object.keys(mem).forEach(k=>delete mem[k]);
      if(db){ try{ db.transaction('levels', 'readwrite').objectStore('levels').clear(); }catch(e){} }
    },
    async react(n){ const m = safeJSON('hasi_s_reacts', {}); m[n] = (m[n] || 0) + 1; setJSON('hasi_s_reacts', m); return m[n]; },
    async trackUser(){
      try{
        if(localStorage.getItem('hasi_counted')) return;
        localStorage.setItem('hasi_counted', '1');
        setJSON('hasi_s_users', (safeJSON('hasi_s_users', 0) || 0) + 1);
      }catch(e){}
    },
    async getStats(){ return {users: safeJSON('hasi_s_users', 0) || 0, reacts: safeJSON('hasi_s_reacts', {})}; },
    async getIntro(){ const r = await getRec('intro'); return (r && r.blob) ? {src: u(r, 'blob'), enabled: r.enabled !== false, name: r.name || ''} : null; },
    async setIntro(file){
      const r = (await getRec('intro')) || blank('intro');
      dropUrls('intro'); r.blob = file; r.type = 'video'; r.enabled = true; r.name = file.name || '';
      await putRec(r);
    },
    async setIntroEnabled(v){ const r = await getRec('intro'); if(!r) return; r.enabled = !!v; await putRec(r); },
    async delIntro(){ const r = await getRec('intro'); if(!r) return; dropUrls('intro'); r.blob = null; await putRec(r); },
    async getTexts(){ return safeJSON('hasi_texts', {}) || {}; },
    async setTexts(o){ setJSON('hasi_texts', o); }
  };
}

/* ---------- ফায়ারবেজ ডেটা লেয়ার (Firestore + Storage) ---------- */
async function fbStore(cfg){
  const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
  const A = await import(base + 'firebase-app.js');
  const F = await import(base + 'firebase-firestore.js');
  const S = await import(base + 'firebase-storage.js');
  const app = A.initializeApp(cfg);
  const fs = F.getFirestore(app);
  const st = S.getStorage(app);
  const ld = n => F.doc(fs, 'levels', String(n));
  const toView = (n, d)=> d ? {
    id: n, type: d.mediaUrl ? (d.type || 'image') : '', caption: d.caption || '',
    mediaSrc: d.mediaUrl || '', audioSrc: d.audioUrl || '', audioName: d.audioName || '', loop: !!d.loop
  } : null;
  async function raw(n){ const s = await F.getDoc(ld(n)); return s.exists() ? s.data() : null; }
  async function upload(path, blob){
    const r = S.ref(st, path);
    await S.uploadBytes(r, blob, blob.type ? {contentType: blob.type} : undefined);
    return S.getDownloadURL(r);
  }
  async function rm(path){ if(!path) return; try{ await S.deleteObject(S.ref(st, path)); }catch(e){} }
  return {
    mode: 'firebase',
    async getLevel(n){ return toView(n, await raw(n)); },
    async getAllLevels(){
      const out = {};
      const snap = await F.getDocs(F.collection(fs, 'levels'));
      snap.forEach(d=>{ const n = parseInt(d.id, 10); if(n >= 1 && n <= TOTAL) out[n] = toView(n, d.data()); });
      return out;
    },
    async setMedia(n, file){
      const type = isVideo(file) ? 'video' : 'image';
      const blob = type === 'video' ? file : await resizeBlob(file, 1200, .85);
      const old = await raw(n);
      const path = 'levels/' + n + '/media_' + Date.now();
      const url = await upload(path, blob);
      await F.setDoc(ld(n), {type: type, mediaUrl: url, mediaPath: path, updatedAt: Date.now()}, {merge: true});
      if(old && old.mediaPath) await rm(old.mediaPath);
    },
    async setAudio(n, file){
      const old = await raw(n);
      const path = 'levels/' + n + '/audio_' + Date.now();
      const url = await upload(path, file);
      await F.setDoc(ld(n), {audioUrl: url, audioPath: path, audioName: file.name || 'ভয়েস', updatedAt: Date.now()}, {merge: true});
      if(old && old.audioPath) await rm(old.audioPath);
    },
    async setCaption(n, t){ await F.setDoc(ld(n), {caption: t, updatedAt: Date.now()}, {merge: true}); },
    async setLoop(n, v){ await F.setDoc(ld(n), {loop: !!v}, {merge: true}); },
    async delMedia(n){
      const o = await raw(n); if(!o) return;
      await rm(o.mediaPath);
      await F.setDoc(ld(n), {type: '', mediaUrl: '', mediaPath: ''}, {merge: true});
    },
    async delAudio(n){
      const o = await raw(n); if(!o) return;
      await rm(o.audioPath);
      await F.setDoc(ld(n), {audioUrl: '', audioPath: '', audioName: '', loop: false}, {merge: true});
    },
    async clearAll(){
      for(let n = 1; n <= TOTAL; n++){
        const o = await raw(n);
        if(o){ await rm(o.mediaPath); await rm(o.audioPath); await F.deleteDoc(ld(n)); }
      }
    },
    async react(n){ await F.setDoc(F.doc(fs, 'stats', String(n)), {count: F.increment(1)}, {merge: true}); },
    async trackUser(){
      try{
        if(localStorage.getItem('hasi_counted')) return;
        localStorage.setItem('hasi_counted', '1');
      }catch(e){}
      await F.setDoc(F.doc(fs, 'stats', '_app'), {users: F.increment(1)}, {merge: true});
    },
    async getStats(){
      const snap = await F.getDocs(F.collection(fs, 'stats'));
      const reacts = {}; let users = 0;
      snap.forEach(d=>{ const v = d.data(); if(d.id === '_app') users = v.users || 0; else reacts[d.id] = v.count || 0; });
      return {users: users, reacts: reacts};
    },
    async getIntro(){
      const s = await F.getDoc(F.doc(fs, 'settings', 'intro'));
      const d = s.exists() ? s.data() : null;
      return (d && d.url) ? {src: d.url, enabled: d.enabled !== false, name: d.name || ''} : null;
    },
    async setIntro(file){
      const ref = F.doc(fs, 'settings', 'intro');
      const o = await F.getDoc(ref);
      const path = 'intro/video_' + Date.now();
      const url = await upload(path, file);
      await F.setDoc(ref, {url: url, path: path, name: file.name || '', enabled: true, updatedAt: Date.now()});
      if(o.exists() && o.data().path) await rm(o.data().path);
    },
    async setIntroEnabled(v){ await F.setDoc(F.doc(fs, 'settings', 'intro'), {enabled: !!v}, {merge: true}); },
    async delIntro(){
      const ref = F.doc(fs, 'settings', 'intro');
      const o = await F.getDoc(ref);
      if(o.exists()){ await rm(o.data().path); await F.deleteDoc(ref); }
    },
    async getTexts(){
      const s = await F.getDoc(F.doc(fs, 'settings', 'texts'));
      return s.exists() ? s.data() : {};
    },
    async setTexts(o){ await F.setDoc(F.doc(fs, 'settings', 'texts'), o); }
  };
}

let Store = null;
let storeNote = '';
async function createStore(){
  if(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey){
    try{ Store = await Promise.race([fbStore(FIREBASE_CONFIG), new Promise((_, rej)=>setTimeout(()=>rej(new Error('timeout')), 10000))]); return Store; }
    catch(e){ storeNote = 'ফায়ারবেজ চালু হয়নি — লোকাল মোডে চলছে'; try{ console.warn(e); }catch(_){} }
  }
  Store = await localStore();
  return Store;
}


(function(){
"use strict";
const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const $ = id => document.getElementById(id);
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';

const EMOJIS = ['🤪','😜','🤡','🥴','😝','🤭','😹','🙈','🤣','😵‍💫','🐵','🦆','🐸','👻','🤓','🥸','😬','🫠','🐔','🐧','🦄','🤠','👽','🐷','🦥'];
const CAPS_OLD = [
 'এই দৃশ্য দেখে না হেসে থাকা অসম্ভব!',
 'হাসি থামাতে পারছি না 🤣',
 'গম্ভীর থাকার চ্যালেঞ্জ — পারবেন?',
 'হাসলে কিন্তু অ্যাপ ডিলিট! 😜',
 'পেট ব্যথা হলে আমি দায়ী না!',
 'একটু হাসুন, আয়ু বাড়ে!',
 'এখনো হাসেননি? তাহলে আপনি রোবট 🤖'
];

let T = Object.assign({}, DEFAULT_TEXTS, safeJSON('hasi_texts_cache', {}));
function setText(el, t){
  el.textContent = '';
  String(t).split('\n').forEach((line, i)=>{ if(i) el.appendChild(document.createElement('br')); el.appendChild(document.createTextNode(line)); });
}
function caps(){ const a = String(T.defaultCaps || '').split('\n').map(x=>x.trim()).filter(Boolean); return a.length ? a : CAPS_OLD; }
function applyTexts(){
  setText($('splashTitle'), T.splashTitle); setText($('splashSub'), T.splashSub);
  setText($('openBtn'), T.openBtn); setText($('noBtn'), T.noBtn);
  setText($('tapHint'), T.tapHint); setText($('gatePrev'), T.gatePrev);
  setText($('prevBtn'), T.prevBtn);
  setText($('endTitle'), T.endTitle); setText($('endSub'), T.endSub); setText($('endPrev'), T.endPrev);
}
applyTexts();

let cur = 1, maxSeen = 0, busy = false;
const cache = {};                      // লেভেল ডেটা ক্যাশ
let reacted = safeJSON('hasi_reacted', {});
const ring = new Audio();
let ringing = 0;                       // কোন লেভেলের ভয়েস এখন বাজছে

try{
  cur = parseInt(localStorage.getItem('hasi_cur') || '1', 10) || 1;
  maxSeen = parseInt(localStorage.getItem('hasi_max') || '0', 10) || 0;
}catch(e){}
if(cur < 1) cur = 1;
if(maxSeen < cur - 1) maxSeen = Math.min(cur - 1, TOTAL);
function saveMeta(){ try{ localStorage.setItem('hasi_cur', String(cur)); localStorage.setItem('hasi_max', String(maxSeen)); }catch(e){} }

const ready = (async function(){
  await createStore();
  try{ await Store.trackUser(); }catch(e){}
})();
/* ---------- শুরুর ভিডিও ---------- */
(async function(){
  const wait = ms => new Promise(r=>setTimeout(r, ms));
  function toSplash(){ $('intro').style.display = 'none'; }
  let iv = null;
  try{
    await Promise.race([ready, wait(9000)]);
    if(typeof Store !== 'undefined' && Store) iv = await Promise.race([Store.getIntro(), wait(6000).then(()=>null)]);
  }catch(e){}
  if(!iv || !iv.enabled || !iv.src){ toSplash(); return; }
  const v = $('introVid'); let done = false;
  function finish(){ if(done) return; done = true; try{ v.pause(); }catch(e){} toSplash(); }
  v.addEventListener('contextmenu', e=>e.preventDefault());
  v.onended = finish; v.onerror = finish;
  v.onpause = ()=>{ if(!done && !v.ended){ const p = v.play(); if(p && p.catch) p.catch(()=>{}); } };
  $('intro').addEventListener('click', ()=>{ v.muted = false; $('introSnd').style.display = 'none'; });
  $('introLoad').style.display = 'none'; $('introCard').style.display = 'block';
  v.src = iv.src; v.loop = false; v.muted = false;
  const p = v.play();
  if(p && p.catch) p.catch(()=>{
    v.muted = true;
    $('introSnd').style.display = 'block';
    const q = v.play(); if(q && q.catch) q.catch(finish);
  });
  setTimeout(()=>{ if(!done && v.currentTime === 0) finish(); }, 12000);   // ভিডিও না চললে আটকে থাকবে না
})();

ready.then(async ()=>{
  try{
    const t = await Store.getTexts();
    if(t && typeof t === 'object'){
      T = Object.assign({}, DEFAULT_TEXTS, t); setJSON('hasi_texts_cache', t); applyTexts();
      const a = document.querySelector('.screen.active');
      if(a && a.id === 'gate') showGate();
    }
  }catch(e){}
});

let tt;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('show'), 2200); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }
function stopVideos(){ document.querySelectorAll('video').forEach(v=>{ try{ v.pause(); }catch(e){} }); }

/* ---------- ডেটা (ক্যাশ + আগাম লোড) ---------- */
async function lvl(n){
  if(cache[n] !== undefined) return cache[n];
  await ready;
  const v = await Store.getLevel(n);
  cache[n] = v;
  return v;
}
function prefetch(n){ if(n >= 1 && n <= TOTAL) lvl(n).catch(()=>{}); }

/* ---------- ভয়েস / রিংটোন ---------- */
function stopRing(){ try{ ring.pause(); ring.currentTime = 0; }catch(e){} ringing = 0; }
function startRing(v, n){
  try{
    ring.src = v.audioSrc;
    ring.loop = !!v.loop;
    ringing = n;
    const p = ring.play();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}
function playRing(n){
  stopRing();
  const v = cache[n];
  if(v !== undefined){ if(v && v.audioSrc) startRing(v, n); return; }
  lvl(n).then(x=>{ if(cur === n && ringing !== n && x && x.audioSrc) startRing(x, n); }).catch(()=>{});
}

/* ---------- দর্শকের ফ্লো ---------- */
function showGate(){
  if(cur > TOTAL){ showEnd(); return; }
  $('gateEm').textContent = EMOJIS[(cur-1) % EMOJIS.length];
  $('gateNum').textContent = T.levelWord + ' ' + bn(cur);
  $('gateSub').textContent = bn(cur) + ' / ' + bn(TOTAL);
  $('gateBar').style.width = ((cur-1) / TOTAL * 100) + '%';
  $('gatePrev').style.display = cur > 1 ? 'block' : 'none';
  show('gate');
  prefetch(cur); prefetch(cur + 1); prefetch(cur - 1);
}
function showEnd(){ stopVideos(); stopRing(); show('end'); }

function openCurrent(){
  if(busy) return;
  busy = true;
  if(cur > maxSeen){ maxSeen = cur; saveMeta(); }
  if(ringing !== cur) playRing(cur);
  $('flashTxt').textContent = T.levelWord + ' ' + bn(cur);
  const fl = $('flash');
  const clone = $('flashTxt').cloneNode(true); clone.id = 'flashTxt';
  fl.replaceChild(clone, $('flashTxt'));
  fl.classList.add('on');
  setTimeout(()=>{ fl.classList.remove('on'); showMedia(); busy = false; }, 1100);
}

function updateReactBtn(){
  const b = $('reactBtn');
  if(reacted[cur]){ b.textContent = T.reactDone; b.classList.add('done'); }
  else { b.textContent = T.reactBtn; b.classList.remove('done'); }
}

async function showMedia(){
  const n = cur;
  $('mTitle').textContent = T.levelWord + ' ' + bn(n) + ' / ' + bn(TOTAL);
  const f = $('frame'); stopVideos(); f.innerHTML = '<div class="ph"><div class="em" style="font-size:60px">⏳</div><small>লোড হচ্ছে...</small></div>';
  $('cap').textContent = '';
  $('nextBtn').textContent = n >= TOTAL ? T.finishBtn : T.nextBtn;
  updateReactBtn();
  show('media');
  let v = null;
  try{ v = await lvl(n); }catch(e){}
  if(cur !== n) return;
  f.innerHTML = '';
  if(v && v.mediaSrc){
    if(v.type === 'video'){
      const el = document.createElement('video');
      el.src = v.mediaSrc; el.controls = true; el.loop = true;
      el.setAttribute('playsinline', ''); el.playsInline = true;
      f.appendChild(el);
      const p = el.play();
      if(p && p.catch) p.catch(()=>{ el.muted = true; const q = el.play(); if(q && q.catch) q.catch(()=>{}); toast('🔇 সাউন্ডের জন্য ভিডিওতে ট্যাপ করুন'); });
    } else {
      const im = document.createElement('img'); im.src = v.mediaSrc; f.appendChild(im);
    }
  } else {
    const p = document.createElement('div'); p.className = 'ph';
    p.innerHTML = '<div class="em">' + EMOJIS[(n-1) % EMOJIS.length] + '</div>';
    f.appendChild(p);
  }
  $('cap').textContent = (v && v.caption) ? v.caption : caps()[(n-1) % caps().length];
}

/* পরবর্তী লেভেলে যাওয়ার বাটন চাপতেই সেই লেভেলের রিংটোন বেজে উঠবে */
function nextLevel(){
  if(busy) return;
  stopVideos(); stopRing();
  cur++;
  saveMeta();
  if(cur > TOTAL){ showEnd(); return; }
  showGate();
  playRing(cur);
}
/* এক এক করে পেছনে — একবারে একটাই লেভেল */
function prevLevel(){
  if(busy) return;
  if(cur <= 1){ toast(T.firstToast); return; }
  stopVideos(); stopRing();
  cur--;
  saveMeta();
  showGate();
  playRing(cur);
}

/* ---------- হাসির রিঅ্যাকশন ---------- */
function burst(){
  const em = ['😂','🤣','😹','😆','🤪'];
  const r = $('reactBtn').getBoundingClientRect();
  for(let k = 0; k < 7; k++){
    const s = document.createElement('div'); s.className = 'laugh';
    s.textContent = em[Math.floor(Math.random() * em.length)];
    s.style.left = (r.left + r.width / 2 + (Math.random() * 160 - 80)) + 'px';
    s.style.top = (r.top - 10) + 'px';
    s.style.animationDelay = (k * 60) + 'ms';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 1700);
  }
  try{ if(navigator.vibrate) navigator.vibrate(40); }catch(e){}
}
$('reactBtn').onclick = async ()=>{
  burst();
  if(reacted[cur]){ toast(T.reactAgain); return; }
  reacted[cur] = 1; setJSON('hasi_reacted', reacted);
  updateReactBtn();
  toast(T.reactToast);
  try{ await ready; await Store.react(cur); }catch(e){}
};

/* ---------- বাটন ও ট্যাপ ---------- */
$('gate').addEventListener('click', openCurrent);
$('gatePrev').addEventListener('click', e=>{ e.stopPropagation(); prevLevel(); });
$('prevBtn').onclick = prevLevel;
$('nextBtn').onclick = nextLevel;
$('endPrev').onclick = ()=>{ cur = TOTAL; saveMeta(); showGate(); playRing(cur); };

$('openBtn').onclick = ()=>{
  // মোবাইলে পরে স্বয়ংক্রিয় ভয়েস বাজানোর অনুমতি পেতে অডিও আনলক
  try{ ring.src = SILENT; const p = ring.play(); if(p && p.then) p.then(()=>ring.pause()).catch(()=>{}); }catch(e){}
  showGate();
};
$('noBtn').onclick = ()=>{ toast(T.noToast); try{ window.close(); }catch(e){} };

/* ---------- ফোনের ব্যাক বাটন: এক ধাপে এক লেভেল ---------- */
function pushH(){ try{ history.pushState({a:1}, '', location.href); }catch(e){} }
pushH();
document.addEventListener('click', pushH, true);      // প্রতি ট্যাপে নতুন এন্ট্রি, যাতে ব্যাক ঠিকভাবে ধরা যায়
window.addEventListener('popstate', ()=>{
  pushH();
  const a = document.querySelector('.screen.active').id;
  if($('intro').style.display !== 'none') return;
  if(a === 'end'){ cur = TOTAL; saveMeta(); showGate(); playRing(cur); }
  else if(a === 'gate' || a === 'media'){ prevLevel(); }
  else toast(T.noBackToast);
});
})();
</script>
